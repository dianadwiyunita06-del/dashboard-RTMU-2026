<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard JSA Jratunseluna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=Lato:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: rapat bulanan BUMN pengelola air — tegas, rapi, siap presentasi
   IDEA: ruang kendali — panel tema di kiri, layar slide + detail di kanan
   PICTURE: slide berformat template resmi Jasa Tirta I (putih, judul hitam tebal, footer biru tua)
   COLOUR: biru tua #182957, toska #067d95, hijau SMK3 #048d7d, kuning aksen #f5b700
   TYPE/LAYOUT: Archivo Black untuk judul slide, Plus Jakarta Sans untuk UI; sidebar 260px + konten */
:root{color-scheme:light dark;--bg:light-dark(#eef3f7,#081626);--ink:light-dark(#0e2033,#e4eef5);--card:light-dark(#fff,#0f2438);--mut:light-dark(#5b7183,#9db4c4);--line:light-dark(#d7e3eb,#1f3f58);--navy:#182957;--teal:#067d95;--green:#048d7d;--acc:#f5b700}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
aside{background:var(--navy);color:#fff;border-right:1px solid light-dark(transparent,#24406a);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;align-self:start}
.brand{padding:0 0 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand .lg{display:flex;align-items:center;gap:14px;height:62px;padding:0 54px 0 18px;margin:0 0 16px;border-bottom:1px solid rgba(255,255,255,.10)}
.brand .lg img{height:22px;width:auto;opacity:.95}
.brand .lg img:nth-child(2){height:14px!important}
.brand .lg img:nth-child(3){height:26px}
.brand i{display:block;font-style:normal;font-size:11.5px;letter-spacing:.02em;color:#8fb8c9;margin:0 18px 4px}
.brand b{display:block;font-size:17px;line-height:1.25;font-weight:700;margin:0 18px}
.brand small{display:block;color:#9fb6c6;font-size:12.5px;margin:6px 18px 0}
nav.topics{padding:10px 10px 20px;display:flex;flex-direction:column;gap:4px}
nav.topics button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;min-height:46px;padding:8px 12px;border-radius:10px;color:#d7e6f0;font-size:15px;font-weight:600;cursor:pointer}
nav.topics button svg{flex:none;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.topics button:hover{background:rgba(255,255,255,.08)}
nav.topics button[aria-current=page]{background:#fff;color:var(--navy)}
nav.topics button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
nav.topics .cnt{margin-left:auto;font-size:12px;opacity:.7;white-space:nowrap}
.side-ft{margin-top:auto;padding:14px 18px;font-size:12px;color:#9fb8c8;border-top:1px solid rgba(255,255,255,.12)}
main{padding:0 0 60px}
.bar{position:sticky;top:0;z-index:20;background:light-dark(rgba(238,243,247,.95),rgba(8,22,38,.95));backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px clamp(16px,3vw,36px);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar label{font-size:14px;color:var(--mut)}
.bar input{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:160px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;min-width:52px}.seg+.seg{margin-left:0}
.seg button[aria-pressed=true]{background:light-dark(var(--navy),var(--teal));color:#fff}
.grow{flex:1}
button{font:inherit;font-size:15px;font-weight:600;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--teal);border-color:var(--teal);color:#fff}
button.on{background:var(--acc);border-color:var(--acc);color:#1a1300}
button:focus-visible,input:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.page{padding:22px clamp(16px,3vw,36px) 0;max-width:1240px}
.page h1{margin:0;font-size:clamp(26px,3vw,38px);line-height:1.08;font-weight:800;text-wrap:balance}
.lead{margin:8px 0 18px;color:var(--mut);max-width:75ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 22px}
.kc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kc b{display:block;font-size:clamp(24px,2.4vw,32px);line-height:1.1;font-weight:800;color:light-dark(var(--navy),#fff)}
.kc span{font-size:14px;color:var(--mut)}
.kc i{display:block;height:6px;border-radius:9px;background:light-dark(#e3edf2,#1f3f58);margin-top:10px;overflow:hidden;font-style:normal}
.kc i em{display:block;height:100%;background:var(--teal)}
h2.sec{font-size:20px;margin:28px 0 10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 16px}
.scroll{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:14px}
.dt th{text-align:left;background:light-dark(#eef4f8,#13304a);padding:8px 10px;font-weight:700;position:sticky;top:0}
.dt td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.dt td.n,.dt th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chips button{min-height:36px;padding:0 12px;font-size:14px;border-radius:99px}
.chips button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.srch{font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:min(360px,100%);margin:0 0 10px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px}
.p-ok{background:#dcf3e6;color:#0f6b43}.p-run{background:#fff1c7;color:#7a5600}.p-no{background:#fde2d6;color:#9a3412}
.mbar{display:flex;align-items:center;gap:8px}.mbar i{flex:1;height:8px;border-radius:9px;background:light-dark(#e3edf2,#1f3f58);overflow:hidden;min-width:60px}.mbar i em{display:block;height:100%;background:var(--teal)}
.fig{position:relative;min-height:300px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.note{font-size:14px;color:var(--mut)}
/* ===== slide template ===== */
.sl{container-type:inline-size;aspect-ratio:16/9;background:#fff;color:#111;border-radius:10px;box-shadow:0 10px 30px rgba(5,30,50,.18);position:relative;overflow:hidden;margin:0 0 8px;font-family:Arial,Helvetica,sans-serif}
.smeta{font-size:13px;color:var(--mut);margin:0 0 24px}
.sh{position:absolute;left:3.6cqw;top:2cqw;right:31cqw}
.sh h3{margin:0;font-family:"Archivo Black",Arial Black,sans-serif;font-weight:400;font-size:2.25cqw;line-height:1.12;text-transform:uppercase;color:#111;letter-spacing:.02em}
.sh p{margin:.4cqw 0 0;font-weight:700;font-size:1.3cqw;color:#067d95;text-transform:uppercase}
.slogo{position:absolute;top:.6cqw;right:.5cqw;display:flex;align-items:center;gap:1.4cqw}
.slogo .pu{height:4.1cqw}.slogo .bm{height:2.9cqw}.slogo .jt{height:6.3cqw}
.sft{position:absolute;left:0;right:0;bottom:0;height:6cqw;background:#182957;display:flex;align-items:center}
.sft .tg{height:2.7cqw;margin-left:3.6cqw}
.sft .jw{height:3.7cqw;margin-left:auto}
.sft em{color:#fff;font-style:italic;font-weight:700;font-size:1.55cqw;margin:0 3cqw 0 1cqw;font-family:Arial,sans-serif}
.sft .gb{width:6.6cqw;height:100%;background:#048d7d;display:flex;align-items:center;justify-content:center}
.sft .gb img{height:4.6cqw}
.bd{position:absolute;left:0;right:0;top:10.6cqw;bottom:6.6cqw;padding:.6cqw 3.6cqw 0;font-size:1.3cqw;line-height:1.35}
.no{position:absolute;right:8cqw;bottom:6.8cqw;font-size:1cqw;color:#8a9aa8}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2cqw}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2.2cqw;height:100%}
.box{border:1px solid #d5e2ea;border-radius:.8cqw;padding:1cqw 1.2cqw;background:#f7fbfd}
.box h4,.bd h4{margin:0 0 .6cqw;font-size:1.4cqw;color:#067d95;font-family:"Archivo Black",Arial Black,sans-serif;font-weight:400;text-transform:uppercase}
table.t{width:100%;border-collapse:collapse;font-size:1.2cqw}
.t th{background:#113b65;color:#fff;font-weight:700;padding:.45cqw .6cqw;text-align:left}
.t td{padding:.4cqw .6cqw;border-bottom:1px solid #dfe9ef}
.t td.n,.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.aud td,.aud th{padding:.3cqw .5cqw;line-height:1.22}.t tr.tot td{font-weight:800;background:#e8f1fb}
table.pp{width:100%;border-collapse:separate;border-spacing:0;border-radius:.9cqw;overflow:hidden;box-shadow:0 .2cqw .8cqw rgba(17,59,101,.08);font-size:1.25cqw;font-weight:600;text-align:center}
.pp .h0{background:linear-gradient(90deg,#24467a,#2f5d93);color:#fff;padding:.6cqw;font-weight:700}
.pp .h1{background:#a9c4ea;color:#1d3557;padding:.45cqw}
.pp td{padding:.6cqw .4cqw;border-bottom:1px solid rgba(255,255,255,.55)}.pp tr:last-child td{border-bottom:0}
.pp .lb{color:#fff}
.cap{font-size:1.05cqw;color:#5b7183;margin-top:.5cqw}
ul.it{list-style:none;margin:0;padding:0}
ul.it li{display:grid;grid-template-columns:minmax(0,1fr) 9cqw;gap:1cqw;align-items:center;padding:.18cqw 0;border-bottom:1px dashed #d5e2ea}
.pb{height:1cqw;background:#e2edf2;border-radius:99px;overflow:hidden;position:relative}
.pb i{position:absolute;inset:0 auto 0 0;background:#067d95;border-radius:99px}
.pv{font-size:1cqw;font-weight:700;text-align:right;color:#113b65}
.ph{border:.18cqw dashed #9cb8c8;border-radius:.8cqw;background:#eef5f9 center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;position:relative;cursor:pointer;min-height:0}
.ph span{background:rgba(24,41,87,.88);color:#fff;font-size:.95cqw;padding:.3cqw .8cqw;border-radius:.5cqw;margin:.5cqw;text-align:center}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.kpi{display:flex;gap:1.2cqw;margin-bottom:1cqw;align-items:center}
.kpi>div{flex:1;border-radius:.8cqw;padding:.8cqw 1.1cqw;background:#eef5fa}
.kpi b{display:block;font-size:2.8cqw;line-height:1;color:#113b65;font-family:"Archivo Black",Arial Black,sans-serif;font-weight:400}
.kpi>div:nth-child(3) b,.kpi>div:nth-child(2):last-child b{color:#0f8a5f}
.lgd{display:flex;flex-wrap:wrap;gap:.3cqw 1cqw;font-size:1cqw;color:#5b7183}.lgd span{white-space:nowrap}.lgd i{display:inline-block;flex:none;width:.9cqw;height:.9cqw;border-radius:50%;margin-right:.3cqw;vertical-align:-.1cqw}
.st-c{color:#0f8a5f;font-weight:700}.st-o{color:#c2410c;font-weight:700}
.cover{position:absolute;inset:0;background:#182957;color:#fff}
.cover .col{position:absolute;right:0;top:0;height:100%;width:42.8cqw;object-fit:cover}
.cover .cl{position:absolute;left:1cqw;top:.6cqw;display:flex;align-items:center;gap:2cqw}
.cover .cl .a{height:6.5cqw}.cover .cl .b{height:2.3cqw}.cover .cl .c{height:7.6cqw}
.cover h2{position:absolute;left:3.6cqw;top:19cqw;width:52cqw;margin:0;font-family:Lato,Arial,sans-serif;font-weight:900;font-size:4cqw;line-height:1.15}
.cover .per{position:absolute;left:3.6cqw;top:31.5cqw;font-family:Lato,Arial,sans-serif;font-weight:700;font-size:2.1cqw;color:#2ab0d6}
.cover .band{position:absolute;left:0;right:0;bottom:0;height:8.9cqw;background:#067d95;padding:1.6cqw 3.6cqw;font-family:Lato,Arial,sans-serif;font-weight:700;font-size:1.5cqw;line-height:1.35}
.cover .band span{color:#182957}
.cover .band img{position:absolute;right:6cqw;top:.6cqw;height:7.4cqw}
.edit [data-k]{outline:1px dashed #f5b700;outline-offset:1px;background:rgba(245,183,0,.1)}
textarea.json{width:100%;min-height:300px;font:13px/1.45 ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink)}
#gs{border:2px solid var(--teal)}#gs.bad{border-color:#c2410c}#gs ol{margin:8px 0 12px;padding-left:22px}
a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:10px;background:var(--teal);color:#fff;font-weight:600;text-decoration:none}
.hero{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(135deg,#182957 0%,#123c6e 55%,#067d95 100%);color:#fff;padding:clamp(24px,4vw,48px);min-height:360px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:24px;margin:18px 0 22px;isolation:isolate}
.hero .hl{display:flex;gap:14px;align-items:center;margin-bottom:18px}.hero .hl img{height:34px}
.hero h1{font-family:Lato,"Plus Jakarta Sans",sans-serif;font-weight:900;font-size:clamp(28px,4vw,48px);line-height:1.08;margin:0}
.hero .tag{display:inline-block;margin-top:14px;background:var(--acc);color:#1a1300;font-weight:800;border-radius:99px;padding:6px 16px}
.hero p{color:#cfe8f1;max-width:52ch;margin:14px 0 20px}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px}.hero .cta button{background:#fff;color:#182957;border:0}.hero .cta button.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35)}
.hero .ph2{position:relative;border-radius:16px;overflow:hidden;min-height:240px;background:url() center/cover}
.hero .ph2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.08);animation:kb 18s ease-in-out infinite alternate}
.hero svg.wv{position:absolute;left:0;right:0;bottom:-2px;width:200%;height:90px;z-index:-1;animation:wv 14s linear infinite}
.hero svg.wv2{animation-duration:22s;opacity:.6;bottom:-8px}
@keyframes wv{to{transform:translateX(-50%)}}@keyframes kb{to{transform:scale(1.18) translate(-3%,-2%)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:0 0 26px}
.tcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;transition:transform .2s ease,box-shadow .2s ease,border-color .2s}
.tcard:hover,.tcard:focus-visible{transform:translateY(-4px);box-shadow:0 14px 30px rgba(6,40,70,.16);border-color:var(--teal)}
.tcard:focus-visible{outline:3px solid var(--acc)}
.tcard .ic{width:42px;height:42px;border-radius:12px;background:light-dark(#e6f3f6,#123a52);display:grid;place-items:center}.tcard .ic svg{width:22px;height:22px;stroke:var(--teal);fill:none;stroke-width:1.9}
.tcard b{font-size:16px}.tcard .big{font-size:26px;font-weight:800;color:light-dark(var(--navy),#fff);line-height:1.1}.tcard small{color:var(--mut);font-size:13px}
.tcard .mch{width:100%;height:56px;display:block;margin:2px 0 2px}.tcard .go{margin-top:auto;font-size:13px;font-weight:700;color:var(--teal)}
@media(max-width:700px){.hero{grid-template-columns:minmax(0,1fr)}.hero .ph2{min-height:180px}}
@media(prefers-reduced-motion:reduce){.hero .ph2 img,.hero svg.wv,.rise{animation:none;opacity:1;transform:none}.tcard{transition:none}}
html{scroll-behavior:smooth;scroll-padding-top:76px}
.ws{container-type:inline-size;background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 0 22px;overflow:hidden;color:var(--ink)}
.wsh{padding:18px 22px 4px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.wsh h2{margin:0;font-size:clamp(19px,2vw,24px);line-height:1.2}
.wsh p{margin:0;font-size:14px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.02em}
.wsh .sn{margin-left:auto;font-size:12px;color:var(--mut)}
.wbd{padding:10px 22px 20px;font-size:max(14px,1.3cqw);line-height:1.4}
.ws .g2{height:auto!important}.ws .box{background:light-dark(#f7fbfd,#13304a);border-color:var(--line)}
.ws .t{font-size:max(13px,1.15cqw)!important}.ws .t td{border-color:var(--line)}.ws .t tr.tot td{background:light-dark(#e8f1fb,#16385a)}
.ws ul.it{font-size:max(13.5px,1.05cqw)!important}.ws ul.it li{border-color:var(--line);padding:6px 0;grid-template-columns:minmax(0,1fr) minmax(90px,9cqw)}
.ws .pb{height:max(8px,.9cqw);background:light-dark(#e2edf2,#1f3f58)}.ws .pv{font-size:max(12px,1cqw);color:light-dark(#113b65,#cfe3f1)}
.ws .cap,.ws .lgd{font-size:max(12.5px,1cqw)}.ws .lgd i{width:10px;height:10px}
.ws [style*="color:#113b65"]{color:light-dark(#113b65,#cfe3f1)!important}.ws .box h4,.ws .bd h4{color:var(--teal)}.ws table.pp{font-size:max(13px,1.2cqw)}.ws table.pp td{color:#111}.ws table.pp td.lb,.ws table.pp td.h0,.ws table.pp td.h1{color:#fff}.ws table.pp td.lb[style*="#e9cf5f"]{color:#111}
.ws .kpi>div{background:light-dark(#eef5fa,#13304a)}.ws .kpi b{font-size:max(24px,2.6cqw);color:light-dark(#113b65,#fff)}
.ws h4{font-size:max(14px,1.3cqw)!important}
.ws .ph{min-height:150px}.ws .ph span{font-size:12px}
.ws svg text{fill:currentColor}
.ws [style*="background:#f2f8fa"]{background:light-dark(#f2f8fa,#13304a)!important}
@container (max-width:720px){.ws .g3,.ws .g2{grid-template-columns:minmax(0,1fr)!important}.ws .kpi{flex-wrap:wrap}.ws .kpi>div{min-width:40%}}
.subnav{display:flex;gap:6px;overflow-x:auto;margin:0 0 18px;position:sticky;top:66px;z-index:10;padding:6px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.subnav button{flex:none;min-height:38px;font-size:14px;border-radius:99px;padding:0 14px}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}.reveal.in{opacity:1;transform:none}
#page.out{opacity:0;transform:translateY(-10px);filter:blur(4px);transition:opacity .32s ease,transform .32s ease,filter .32s ease}
#page.swap>*{animation:swap 1.05s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--i,0)*90ms)}
@keyframes swap{0%{opacity:0;transform:translateY(36px) scale(.985);filter:blur(8px)}60%{filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
nav.topics button{transition:background .35s ease,color .35s ease,transform .35s ease}nav.topics button[aria-current=page]{transform:translateX(3px)}
@media(prefers-reduced-motion:reduce){#page.swap>*{animation:none}#page.out{transition:none}aside,.app{transition:none}html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}
.ws .pb,.ws ul.it .pb{border-radius:2px}.ws .pb i{border-radius:2px}.swap{animation:none}}
@media(max-width:860px){.subnav{top:0}}
@property --p{syntax:"<number>";inherits:false;initial-value:1}
.da{stroke-dasharray:calc(var(--l) * var(--p) * 1px) calc(var(--g) * 1px);animation:dp 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes dp{from{--p:0}to{--p:1}}
.gbr{transform-box:fill-box;transform-origin:50% 100%;animation:gy 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes gy{from{transform:scaleY(0)}}
.pb i,.mbar i em,.kc i em,.gw{transform-origin:0 50%;animation:gx 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes gx{from{transform:scaleX(0)}}

function donut(segs,center,sub,size){const tt=segs.reduce((a,s)=>a+s[1],0)||1,r=46,Cc=2*Math.PI*r;let off=0;const arcs=segs.filter(s=>s[1]>0).map(s=>{const l=s[1]/tt*Cc,el=`<circle r="${r}" cx="60" cy="60" fill="none" stroke="${s[2]}" stroke-width="16" class="da" style="--l:${l};--g:${Cc}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l;return el}).join("");return `<svg viewBox="0 0 120 120" style="width:${size}cqw;height:${size}cqw;flex:none" role="img"><circle r="${r}" cx="60" cy="60" fill="none" stroke="#e2edf2" stroke-width="16"/>${arcs}<text x="60" y="${sub?60:68}" text-anchor="middle" font-size="26" font-weight="800" fill="#113b65">${esc(center)}</text>${sub?`<text x="60" y="80" text-anchor="middle" font-size="12" fill="#5b7183">${esc(sub)}</text>`:""}</svg>`}

function gbar(cats,ser,H){const W=600,h=H||250,top=24,bot=34,ph=h-top-bot,gw=W/cats.length,bw=Math.min(44,gw/(ser.length+1));let g=`<line x1="0" x2="${W}" y1="${top+ph}" y2="${top+ph}" stroke="#9cb8c8"/>`;[50,100].forEach(v=>{const y=top+ph-v/100*ph;g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#e2edf2" stroke-dasharray="4 4"/><text x="2" y="${y-3}" font-size="11" fill="#7d93a3">${v}%</text>`});cats.forEach((c,i)=>{const x0=i*gw+(gw-bw*ser.length-6*(ser.length-1))/2;ser.forEach((s,j)=>{const v=Math.min(100,num(s[1][i])),bh=v/100*ph,x=x0+j*(bw+6);g+=`<rect class="gbr" style="animation-delay:${(i*ser.length+j)*70}ms" x="${x}" y="${top+ph-bh}" width="${bw}" height="${bh}" rx="3" fill="${s[2]}"/><text x="${x+bw/2}" y="${top+ph-bh-5}" text-anchor="middle" font-size="11" font-weight="700" fill="#113b65">${f1(num(s[1][i]))}</text>`});g+=`<text x="${i*gw+gw/2}" y="${h-11}" text-anchor="middle" font-size="13" fill="#111">${esc(c)}</text>`});return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:auto;display:block">${g}</svg>`}

async function getDl(){try{return await Promise.race([window.claude?.use?.("downloads"),new Promise(r=>setTimeout(()=>r(null),4000))])||null}catch(e){return null}}

 m.innerHTML=`<div class="pvbox"><div class="pvhd"><b>${T("pvT")}</b><span class="pvc" id="pvc"></span><span class="grow"></span><button type="button" id="pvClose">${T("pvClose")}</button><button type="button" class="pri" id="pvDl">${T("pvDl")}</button></div><div class="pvtrack" id="pvt">${html}</div><div class="pvnav"><button type="button" id="pvPrev" aria-label="Sebelumnya">‹</button><div class="pvdots">${ids.map((s,i)=>`<button type="button" data-pv="${i}" aria-label="Slide ${SN[s]}">${SN[s]}</button>`).join("")}</div><button type="button" id="pvNext" aria-label="Berikutnya">›</button></div><p class="note" style="margin:6px 4px 0">${T("pvNote")}</p></div>`;
 m.hidden=false;document.body.style.overflow="hidden";pvI=0;pvGo(0,true);const tr=document.getElementById("pvt");tr.addEventListener("scroll",()=>{const i=Math.round(tr.scrollLeft/tr.clientWidth);if(i!==pvI){pvI=i;pvMark()}},{passive:true});document.getElementById("pvDl").focus()}
function pvMark(){document.getElementById("pvc").textContent=`${pvI+1} / ${ORDER.length}`;document.querySelectorAll("[data-pv]").forEach((b,i)=>b.setAttribute("aria-current",i===pvI))}
