<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f4f6f8, #09131d);
  --surface: light-dark(#ffffff, #101e2c);
  --surface-alt: light-dark(#f8fafc, #152638);
  --ink: light-dark(#0f172a, #f1f5f9);
  --mut: light-dark(#475569, #94a3b8);
  --line: light-dark(#cbd5e1, #1e3348);
  --line-subtle: light-dark(#e2e8f0, #17293b);
  
  /* Identitas Korporat Jasa Tirta I */
  --navy: #14244b;
  --navy-deep: #0d1834;
  --teal: #056b80;
  --teal-soft: light-dark(#e6f4f7, #0d3340);
  --green: #047857;
  --acc: #eab308;
  --acc-ink: #1e1b04;
}

:root[data-theme=light] { color-scheme: light; }
:root[data-theme=dark] { color-scheme: dark; }

* { box-sizing: border-box; min-width: 0; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}

/* ===== LAYOUT UTAMA ===== */
.app {
  display: grid;
  grid-template-columns: 272px minmax(0, 1fr);
  min-height: 100vh;
}

/* ===== SIDEBAR KENDALI ===== */
aside {
  background: var(--navy);
  color: #f8fafc;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  border-right: 1px solid rgba(255, 255, 255, 0.08);
}

.brand {
  padding: 20px 20px 16px;
  background: var(--navy-deep);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.brand .lg {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.brand .lg img {
  height: 28px;
  width: auto;
  object-fit: contain;
}

.brand b {
  display: block;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.01em;
  line-height: 1.35;
  color: #ffffff;
}

.brand small {
  display: block;
  margin-top: 2px;
  color: #8ecae6;
  font-size: 12px;
  font-weight: 500;
}

nav.topics {
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

nav.topics button {
  all: unset;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 42px;
  padding: 8px 12px;
  border-radius: 6px;
  color: #cbd5e1;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  position: relative;
  transition: background-color 0.15s ease, color 0.15s ease;
}

nav.topics button svg {
  flex: none;
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  opacity: 0.85;
}

nav.topics button:hover {
  background: rgba(255, 255, 255, 0.06);
  color: #ffffff;
}

nav.topics button[aria-current=page] {
  background: rgba(255, 255, 255, 0.12);
  color: #ffffff;
  font-weight: 700;
}

nav.topics button[aria-current=page]::before {
  content: "";
  position: absolute;
  left: 0;
  top: 8px;
  bottom: 8px;
  width: 3px;
  background: var(--acc);
  border-radius: 0 2px 2px 0;
}

nav.topics button[aria-current=page] svg {
  stroke: var(--acc);
  opacity: 1;
}

nav.topics button:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: -2px;
}

nav.topics .cnt {
  margin-left: auto;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.25);
  color: #94a3b8;
  font-variant-numeric: tabular-nums;
}

nav.topics button[aria-current=page] .cnt {
  background: var(--acc);
  color: var(--acc-ink);
}

.side-ft {
  margin-top: auto;
  padding: 14px 20px;
  font-size: 11.5px;
  line-height: 1.4;
  color: #94a3b8;
  background: var(--navy-deep);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

/* ===== TOP TOOLBAR ===== */
main { padding: 0 0 64px; }

.bar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 10px clamp(16px, 3vw, 40px);
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}

.bar label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--mut);
}

.bar input {
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface-alt);
  color: var(--ink);
  width: 170px;
}

.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  background: var(--surface-alt);
}

.seg button {
  border: 0;
  border-radius: 0;
  min-height: 34px;
  padding: 0 12px;
  font-size: 12px;
  font-weight: 700;
  background: transparent;
  color: var(--mut);
}

.seg button[aria-pressed=true] {
  background: var(--navy);
  color: #ffffff;
}

.grow { flex: 1; }

button {
  font: inherit;
  font-size: 13.5px;
  font-weight: 600;
  min-height: 36px;
  padding: 0 14px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  transition: border-color 0.15s ease, background-color 0.15s ease;
}

button:hover {
  border-color: var(--teal);
  background: var(--surface-alt);
}

button.pri {
  background: var(--teal);
  border-color: var(--teal);
  color: #ffffff;
}

button.pri:hover {
  background: #045668;
  border-color: #045668;
}

button.on {
  background: var(--acc);
  border-color: var(--acc);
  color: var(--acc-ink);
}

button:focus-visible, input:focus-visible, select:focus-visible, [contenteditable]:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 2px;
}

/* ===== KONTEN HALAMAN ===== */
.page {
  padding: 28px clamp(16px, 3vw, 40px) 0;
  max-width: 1280px;
}

.page h1 {
  margin: 0;
  font-size: clamp(22px, 2.5vw, 30px);
  line-height: 1.2;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--ink);
}

.lead {
  margin: 6px 0 22px;
  font-size: 15px;
  color: var(--mut);
  max-width: 72ch;
}

/* ===== HERO BANNER (EDITORIAL & KORPORAT, TANPA GELOMBANG KLISÉ) ===== */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: 8px;
  background: var(--navy);
  border: 1px solid var(--navy-deep);
  color: #ffffff;
  padding: clamp(24px, 3.5vw, 40px);
  min-height: 310px;
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.75fr);
  gap: 28px;
  margin: 0 0 26px;
}

.hero::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--acc) 0%, var(--teal) 50%, var(--green) 100%);
}

.hero .hl {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-bottom: 16px;
}

.hero .hl img { height: 30px; }

.hero h1 {
  font-family: "Plus Jakarta Sans", sans-serif;
  font-weight: 800;
  font-size: clamp(24px, 3.2vw, 38px);
  line-height: 1.15;
  letter-spacing: -0.02em;
  color: #ffffff;
  margin: 0;
}

.hero .tag {
  display: inline-block;
  margin-top: 12px;
  background: rgba(234, 179, 8, 0.16);
  border: 1px solid rgba(234, 179, 8, 0.45);
  color: #fde047;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  border-radius: 4px;
  padding: 4px 10px;
}

.hero p {
  color: #cbd5e1;
  font-size: 14.5px;
  max-width: 56ch;
  margin: 14px 0 22px;
}

.hero .cta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.hero .cta button {
  background: #ffffff;
  color: var(--navy);
  border: 1px solid #ffffff;
  font-weight: 700;
}

.hero .cta button:hover {
  background: #f1f5f9;
}

.hero .cta button.ghost {
  background: transparent;
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.35);
}

.hero .cta button.ghost:hover {
  background: rgba(255, 255, 255, 0.1);
}

.hero .ph2 {
  position: relative;
  border-radius: 6px;
  overflow: hidden;
  min-height: 220px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: var(--navy-deep) center/cover;
}

.hero .ph2 img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Sembunyikan dekorasi gelombang SVG generik */
.hero svg.wv, .hero svg.wv2 { display: none; }

/* ===== KPI CARDS ===== */
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
  gap: 14px;
  margin: 0 0 26px;
}

.kc {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.kc b {
  display: block;
  font-size: clamp(22px, 2.2vw, 28px);
  line-height: 1.15;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  color: light-dark(var(--navy), #ffffff);
}

.kc span {
  display: block;
  margin-top: 4px;
  font-size: 13px;
  font-weight: 500;
  color: var(--mut);
}

.kc i {
  display: block;
  height: 4px;
  border-radius: 2px;
  background: var(--line-subtle);
  margin-top: 12px;
  overflow: hidden;
  font-style: normal;
}

.kc i em {
  display: block;
  height: 100%;
  background: var(--teal);
}

/* ===== TOPIC GRID CARDS ===== */
.tgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 14px;
  margin: 0 0 28px;
}

.tcard {
  all: unset;
  box-sizing: border-box;
  cursor: pointer;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: border-color 0.15s ease, background-color 0.15s ease;
}

.tcard:hover, .tcard:focus-visible {
  border-color: var(--teal);
  background: var(--surface-alt);
}

.tcard:focus-visible { outline: 2px solid var(--acc); }

.tcard .ic {
  width: 36px;
  height: 36px;
  border-radius: 6px;
  background: var(--teal-soft);
  display: grid;
  place-items: center;
}

.tcard .ic svg {
  width: 19px;
  height: 19px;
  stroke: var(--teal);
  fill: none;
  stroke-width: 2;
}

.tcard b {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  margin-top: 2px;
}

.tcard .big {
  font-size: 24px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  color: light-dark(var(--navy), #ffffff);
  line-height: 1.15;
}

.tcard small {
  color: var(--mut);
  font-size: 13px;
  line-height: 1.4;
}

.tcard .go {
  margin-top: 8px;
  padding-top: 10px;
  border-top: 1px solid var(--line-subtle);
  font-size: 12.5px;
  font-weight: 700;
  color: var(--teal);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ===== PANEL & DATA TABLES ===== */
h2.sec {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.01em;
  margin: 30px 0 12px;
  color: var(--ink);
}

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 18px;
  margin: 0 0 18px;
}

.scroll { overflow-x: auto; }

table.dt {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}

.dt th {
  text-align: left;
  background: var(--surface-alt);
  color: var(--mut);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 10px 12px;
  font-weight: 700;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
}

.dt td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--line-subtle);
  vertical-align: top;
}

.dt tbody tr:hover td {
  background: var(--surface-alt);
}

.dt td.n, .dt th.n {
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0 0 12px;
}

.chips button {
  min-height: 32px;
  padding: 0 12px;
  font-size: 13px;
  border-radius: 6px;
}

.chips button[aria-pressed=true] {
  background: var(--navy);
  color: #ffffff;
  border-color: var(--navy);
}

.srch {
  font: inherit;
  font-size: 14px;
  height: 38px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface-alt);
  color: var(--ink);
  width: min(360px, 100%);
  margin: 0 0 12px;
}

.pill {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 700;
  border-radius: 4px;
  padding: 2px 8px;
}

.p-ok { background: #dcfce7; color: #166534; }
.p-run { background: #fef3c7; color: #92400e; }
.p-no { background: #fee2e2; color: #991b1b; }

.mini { display: flex; align-items: center; gap: 8px; }
.mini i { flex: 1; height: 6px; border-radius: 3px; background: var(--line-subtle); overflow: hidden; min-width: 60px; }
.mini i em { display: block; height: 100%; background: var(--teal); }

.fig { position: relative; min-height: 300px; }
.fig > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.note { font-size: 13px; color: var(--mut); }

/* ===== SLIDE TEMPLATE RESMI (16:9 PPTX PREVIEW) ===== */
.sl {
  container-type: inline-size;
  aspect-ratio: 16/9;
  background: #ffffff;
  color: #111111;
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
  position: relative;
  overflow: hidden;
  margin: 0 0 8px;
  font-family: Arial, Helvetica, sans-serif;
}

.smeta { font-size: 12.5px; color: var(--mut); margin: 0 0 24px; }
.sh { position: absolute; left: 3.6cqw; top: 2cqw; right: 31cqw; }
.sh h3 { margin: 0; font-family: "Archivo Black", Arial Black, sans-serif; font-weight: 400; font-size: 2.25cqw; line-height: 1.12; text-transform: uppercase; color: #111; letter-spacing: .02em; }
.sh p { margin: .4cqw 0 0; font-weight: 700; font-size: 1.3cqw; color: #067d95; text-transform: uppercase; }

.sft .jw { height: 3.7cqw; margin-left: auto; }

.sft .gb { width: 6.6cqw; height: 100%; background: #048d7d; display: flex; align-items: center; justify-content: center; }
.sft .gb img { height: 4.6cqw; }
.bd { position: absolute; left: 0; right: 0; top: 10.6cqw; bottom: 6.6cqw; padding: .6cqw 3.6cqw 0; font-size: 1.3cqw; line-height: 1.35; }
.no { position: absolute; right: 8cqw; bottom: 6.8cqw; font-size: 1cqw; color: #8a9aa8; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2cqw; }
.g2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2.2cqw; height: 100%; }
.box { border: 1px solid #d5e2ea; border-radius: .6cqw; padding: 1cqw 1.2cqw; background: #f7fbfd; }
.box h4, .bd h4 { margin: 0 0 .6cqw; font-size: 1.4cqw; color: #067d95; font-family: "Archivo Black", Arial Black, sans-serif; font-weight: 400; text-transform: uppercase; }
table.t { width: 100%; border-collapse: collapse; font-size: 1.2cqw; }
.t th { background: #113b65; color: #fff; font-weight: 700; padding: .45cqw .6cqw; text-align: left; }
.t td { padding: .4cqw .6cqw; border-bottom: 1px solid #dfe9ef; }
.t td.n, .t th.n { text-align: right; font-variant-numeric: tabular-nums; }

table.pp { width: 100%; border-collapse: separate; border-spacing: .2cqw; font-size: 1.25cqw; font-weight: 700; text-align: center; }

.cap { font-size: 1.05cqw; color: #5b7183; margin-top: .5cqw; }
ul.it { list-style: none; margin: 0; padding: 0; }
ul.it li { display: grid; grid-template-columns: minmax(0, 1fr) 9cqw; gap: 1cqw; align-items: center; padding: .18cqw 0; border-bottom: 1px dashed #d5e2ea; }

.pb i { position: absolute; inset: 0 auto 0 0; background: #067d95; border-radius: 99px; }

.kpi > div { flex: 1; border-radius: .6cqw; padding: .8cqw 1.1cqw; background: #eef5fa; }
.kpi b { display: block; font-size: 2.8cqw; line-height: 1; color: #113b65; font-family: "Archivo Black", Arial Black, sans-serif; font-weight: 400; }
.kpi > div:nth-child(3) b, .kpi > div:nth-child(2):last-child b { color: #0f8a5f; }
.lgd { display: flex; flex-wrap: wrap; gap: .3cqw 1cqw; font-size: 1cqw; color: #5b7183; } .lgd i { display: inline-block; width: .9cqw; height: .9cqw; border-radius: .2cqw; margin-right: .3cqw; vertical-align: -.1cqw; }
.st-c { color: #0f8a5f; font-weight: 700; } .st-o { color: #c2410c; font-weight: 700; }

.cover .col { position: absolute; right: 0; top: 0; height: 100%; width: 42.8cqw; object-fit: cover; }

.cover .cl .a { height: 6.5cqw; } .cover .cl .b { height: 2.3cqw; } .cover .cl .c { height: 7.6cqw; }
.cover h2 { position: absolute; left: 3.6cqw; top: 19cqw; width: 52cqw; margin: 0; font-family: Lato, Arial, sans-serif; font-weight: 900; font-size: 4cqw; line-height: 1.15; }
.cover .per { position: absolute; left: 3.6cqw; top: 31.5cqw; font-family: Lato, Arial, sans-serif; font-weight: 700; font-size: 2.1cqw; color: #2ab0d6; }
